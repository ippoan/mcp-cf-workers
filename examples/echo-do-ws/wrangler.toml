name = "echo-do-ws"
main = "src/index.ts"
# Same account as the other ippoan Workers. Setting this lets wrangler skip the
# /memberships lookup (which the deploy token isn't scoped for) and authenticate
# straight to the account with just Workers Scripts:Edit.
account_id = "24b45709d060d957340180e995f0d373"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
# Expose a *.workers.dev URL so the hard-gate runbook can `claude mcp add` it
# without configuring a custom route.
workers_dev = true

# Bump this between deploys (or just redeploy) to observe the deploy → reconnect
# behavior in a live Claude Code session.
[vars]
BUILD_TAG = "v1"

# The McpAgent runs inside this Durable Object. mountDurableMcp defaults to the
# binding name "MCP_OBJECT".
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "EchoMcp"

# McpAgent persists session state (props, initialize request) in DO SQLite
# storage, so the class must be registered as a SQLite-backed DO.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EchoMcp"]
