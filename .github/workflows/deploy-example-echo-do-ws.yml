name: deploy example echo-do-ws

# Deploys the Phase 0 hard-gate PoC (examples/echo-do-ws) to Cloudflare Workers.
#
# Auto-deploys on every push to main that touches the example or the lib source
# it bundles, so the gate's deploy half needs no button-pushing: each merge to
# main redeploys with BUILD_TAG = commit SHA (a fresh tag), which is exactly the
# v1→v2 change the gate observes. `workflow_dispatch` stays for ad-hoc deploys
# with an explicit tag.
#
# To exercise the gate: keep a Claude Code session connected to the worker, push
# anything to main (or dispatch), then check whether `echo` reports the new SHA
# without reconnecting. See examples/echo-do-ws/README.md.
# Refs #6, ippoan/secrets-inventory#70.

on:
  push:
    branches: [main]
    paths:
      - 'examples/echo-do-ws/**'
      - 'src/**'
      - '.github/workflows/deploy-example-echo-do-ws.yml'
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'BUILD_TAG baked into the worker (defaults to the commit SHA)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/echo-do-ws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The example depends on the in-repo lib via `file:../..` (a symlink to the
      # repo root). esbuild resolves the lib's own imports (@modelcontextprotocol
      # /sdk, agents) relative to the root, so the root devDependencies must be
      # installed too — not just the example's.
      - name: Install lib deps (root)
        working-directory: .
        run: npm install --no-audit --no-fund

      - name: Install example deps
        run: npm install --no-audit --no-fund

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pass inputs via env (never interpolate ${{ }} into the shell) to
          # avoid command injection. On push there is no input, so fall back to
          # the commit SHA — a distinct, visible tag per deploy.
          BUILD_TAG: ${{ github.event.inputs.build_tag || github.sha }}
        run: |
          # pipefail so a wrangler failure fails the step (the `| tee` would
          # otherwise mask wrangler's non-zero exit and report a false green).
          set -o pipefail
          npx wrangler deploy --var "BUILD_TAG:${BUILD_TAG}" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### echo-do-ws deployed"
            echo ""
            echo "- BUILD_TAG: \`${BUILD_TAG}\`"
            echo "- MCP endpoint: \`${url}/mcp\`"
            echo ""
            echo "Connect: \`claude mcp add --transport http echo-do-ws ${url}/mcp\`"
          } >> "$GITHUB_STEP_SUMMARY"
