name: publish
on:
  push:
    tags: ['v*']
jobs:
  publish:
    permissions:
      contents: read
      packages: write
    # NOTE: pinned to the in-flight branch until ci-workflows#PR merges.
    # Flip back to `@main` after merge.
    uses: ippoan/ci-workflows/.github/workflows/lib-publish.yml@claude/intelligent-pascal-11ZHO
    with:
      node_version: '20'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
