name: Dev Release (auto patch bump)

# main push 毎に semver patch を自動 increment して `v{major}.{minor}.{patch}`
# tag を push する。 ci-workflows/tag-release.yml の Mode A を bump=patch
# 固定で呼び出す。
#
# 流れ:
#   1. main に src 変更がマージされる
#   2. 本 workflow が tag-release.yml@main を call、 直近 `v*` tag を見て
#      patch+1 を計算して push (TAG_RELEASE_PAT 経由)
#   3. tag push が publish.yml を trigger → `@ippoan/mcp-cf-workers@v{N}` が
#      GitHub Packages に publish される
#
# 命名: ファイル名は dev-release.yml だが、 採番されるのは正規 semver tag
# (= `v0.0.1`, `v0.0.2`, …)。 `dev-N` counter / npm prerelease は使わない。
# 「dev channel」= 「main 反映ごとの自動 patch increment」と定義。
#
# minor / major bump は別途 release.yml (workflow_dispatch) で手動 — 必要に
# なったら追加。 現状は patch auto のみで運用。
#
# tag-release.yml の skip-if-already-tagged ロジックがあるため、 同一 commit
# への重複発火は no-op。 paths filter で docs / meta only commit はそもそも
# trigger しないようにして release ノイズを抑える。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'

permissions:
  contents: write

jobs:
  release:
    uses: ippoan/ci-workflows/.github/workflows/tag-release.yml@main
    with:
      bump: patch
    secrets:
      TAG_RELEASE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
