name: Dev Release

# main push 毎に `dev-{major}.{minor}.{patch}` tag を自動採番 + GitHub
# Release (prerelease) を作成する。 ci-workflows/tag-release.yml の
# Mode B (create_release: true) を `version_prefix: ''` + `prefix: 'dev-'`
# で呼び出し、 tag 形式を `dev-0.0.1`, `dev-0.0.2`, … にする。
#
# 流れ:
#   1. main に src 変更がマージされる
#   2. tag-release.yml@main が直近 `dev-*` を見て patch+1 を計算
#   3. GitHub Release を prerelease で作成 (Mode B、 PAT 不要)
#
# tag-release.yml の Mode B は prefix が non-empty (= 'dev-') の場合
# `--latest` を付けない仕様なので、 `dev-*` は releases/latest API に
# 出ない (stable consumer 無影響)。
#
# npm publish 連鎖は別途 — publish.yml は引き続き `v*` tag のみ trigger。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'

permissions:
  contents: write

jobs:
  dev-release:
    uses: ippoan/ci-workflows/.github/workflows/tag-release.yml@main
    with:
      prefix: 'dev-'
      version_prefix: ''
      bump: patch
      create_release: true
