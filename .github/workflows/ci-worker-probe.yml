name: ci-worker-probe

# CI-as-worker / re-wake PoC (cc-relay #69 follow-up):
#   trigger → CI が動く → CI が `github-actions[bot]` 名義で comment を打つ
#   → その comment は購読 session (yhonda-ohishi) とは別 identity なので
#     harness の self-filter を通過し、subscribe_pr_activity 購読中の CCoW
#     session を **re-wake** する。**失敗は不要**(失敗が要るのは別 identity の
#     イベントが無い時だけ。bot comment 自体が別 identity)。
#
# trigger 3 経路:
#   push           : payload = commit message
#   workflow_dispatch: payload = inputs.msg (型付き変数を綺麗に渡せる)
#   issue_comment  : payload = comment body (ChatOps。main の workflow だけ発火)
#
# injection 対策: 外部入力は必ず env: 経由。run に ${{ }} を直書きしない。
on:
  push:
    branches: [test/wake-ci]
  workflow_dispatch:
    inputs:
      msg:
        description: payload to act on
        type: string
        default: "dispatch payload"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  act:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve payload from whichever trigger fired
        id: payload
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_MSG: ${{ github.event.inputs.msg }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) payload="$DISPATCH_MSG" ;;
            push)              payload="$COMMIT_MSG" ;;
            issue_comment)     payload="$COMMENT_BODY" ;;
            *)                 payload="(unknown event $EVENT)" ;;
          esac
          summary="$(printf '%s' "$payload" | tr '\n' ' ' | cut -c1-120)"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "::notice::ci-worker fired by '$EVENT': $summary"

      - name: Act — bot-identity comment (the re-wake bell; no failure)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          BRANCH: ${{ github.ref_name }}
          SUMMARY: ${{ steps.payload.outputs.summary }}
        run: |
          set -euo pipefail
          body="🤖 ci-worker fired (event=${EVENT}, run ${GITHUB_RUN_ID}) — payload: \`${SUMMARY}\`"
          if [ "$EVENT" = "issue_comment" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "$body"
          else
            # push / workflow_dispatch: comment on the open PR for this branch.
            gh pr comment "$BRANCH" --repo "$REPO" --body "$body"
          fi
