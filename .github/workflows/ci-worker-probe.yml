name: ci-worker-probe

# CI-as-worker / re-wake PoC (cc-relay #69 follow-up):
#   trigger → CI が動く → CI が `github-actions[bot]` 名義で comment を打つ
#   → その comment は購読 session (yhonda-ohishi) とは別 identity なので
#     harness の self-filter を通過し、subscribe_pr_activity 購読中の CCoW
#     session を **re-wake** する。
#
# このファイルは元 test/wake-ci 版の copy on claude/secrets-inventory-73-comment-orFMh
# branch。`gh pr comment` が "no pull requests found for branch" で fail する
# regression を、PR 検索 + 無ければ commit comment への fallback で塞ぐ。
#
# trigger 3 経路:
#   push           : payload = commit message
#   workflow_dispatch: payload = inputs.msg
#   issue_comment  : payload = comment body (ChatOps)
#
# injection 対策: 外部入力は必ず env: 経由。run に ${{ }} を直書きしない。
on:
  push:
    branches:
      - test/wake-ci
      - claude/secrets-inventory-73-comment-orFMh
  workflow_dispatch:
    inputs:
      msg:
        description: payload to act on
        type: string
        default: "dispatch payload"
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  act:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve payload from whichever trigger fired
        id: payload
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_MSG: ${{ github.event.inputs.msg }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) payload="$DISPATCH_MSG" ;;
            push)              payload="$COMMIT_MSG" ;;
            issue_comment)     payload="$COMMENT_BODY" ;;
            *)                 payload="(unknown event $EVENT)" ;;
          esac
          summary="$(printf '%s' "$payload" | tr '\n' ' ' | cut -c1-120)"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "::notice::ci-worker fired by '$EVENT': $summary"

      - name: Act — bot-identity comment (wake-bell, auto-deletes after 60s)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SUMMARY: ${{ steps.payload.outputs.summary }}
        run: |
          set -euo pipefail
          body="🤖 ci-worker fired (event=${EVENT}, run ${GITHUB_RUN_ID}) — payload: \`${SUMMARY}\` _(auto-deletes in 60s)_"

          # Post the wake-bell via `gh api` so we capture the comment id, then
          # sleep 60s and delete it. The wake itself is delivered by the webhook
          # at post time; the comment body in the PR / commit is only noise once
          # subscribing sessions have been woken.
          KIND=""       # "issue" or "commit"
          COMMENT_ID=""

          post_issue_comment () {
            local target_num="$1"
            local resp
            resp="$(gh api "repos/${REPO}/issues/${target_num}/comments" -f body="$body")"
            COMMENT_ID="$(printf '%s' "$resp" | jq -r '.id')"
            KIND="issue"
          }
          post_commit_comment () {
            local resp
            resp="$(gh api "repos/${REPO}/commits/${SHA}/comments" -f body="$body")"
            COMMENT_ID="$(printf '%s' "$resp" | jq -r '.id')"
            KIND="commit"
          }

          if [ "$EVENT" = "issue_comment" ]; then
            post_issue_comment "$ISSUE_NUM"
          else
            # push / workflow_dispatch: prefer the open PR for this branch,
            # fall back to a commit comment if no PR exists.
            PR_NUM="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                        --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [ -n "${PR_NUM:-}" ]; then
              echo "::notice::commenting on PR #${PR_NUM}"
              post_issue_comment "$PR_NUM"
            else
              echo "::notice::no open PR for branch '${BRANCH}', falling back to commit comment on ${SHA}"
              post_commit_comment
            fi
          fi

          echo "::notice::posted ${KIND} comment id=${COMMENT_ID}, sleeping 60s before delete"
          sleep 60

          if [ "$KIND" = "issue" ]; then
            gh api -X DELETE "repos/${REPO}/issues/comments/${COMMENT_ID}" >/dev/null
          else
            gh api -X DELETE "repos/${REPO}/comments/${COMMENT_ID}" >/dev/null
          fi
          echo "::notice::deleted ${KIND} comment id=${COMMENT_ID}"
